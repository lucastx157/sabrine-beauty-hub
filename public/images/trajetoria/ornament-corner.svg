    <!-- small S scroll terminals -->
    <path d="M156 30 C 168 26, 178 34, 172 42 C 168 47, 160 44, 162 39 C 163 36, 167 36, 167 39 C 169 34, 164 31, 159 33 Z"/>
    <path d="M30 156 C 26 168, 34 178, 42 172 C 47 168, 44 160, 39 162 C 36 163, 36 167, 39 167 C 34 169, 31 164, 33 159 Z"/>
